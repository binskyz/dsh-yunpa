name: 功能请求
description: 新站点、新抓取能力、UI 改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        先看两个问题：这个功能能不能只靠 `sites.json` 加一行就实现？能不能用现有的 31 个工具组合出来？
        两个都不行，再往下填。

  - type: textarea
    id: need
    attributes:
      label: 你想做什么（一句话）
      description: 说场景，别说实现。「抓某个站的楼中楼作者」比「加个 API」有用。
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: 现在怎么凑合，卡在哪
      description: 现在用哪几个工具做的、哪一步要手工补
    validations:
      required: true

  - type: dropdown
    id: kind
    attributes:
      label: 属于哪类
      options:
        - 新站点（sites.json 加一条就够）
        - 新站点（要写专属解析）
        - 抓取/翻页能力
        - 凭据库与登录态
        - 浏览器动作层
        - 设置页 UI
        - 自检与安装
    validations:
      required: true

  - type: textarea
    id: alternative
    attributes:
      label: 你考虑过的替代做法
      description: 用别的工具、别的站点、手工导出——说说为什么不够
